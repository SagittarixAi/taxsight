server {
    listen 80;
    server_name taxsight.srv1180690.hstgr.cloud taxsight.ai www.taxsight.ai;
    
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver for dynamic container resolution
    resolver 127.0.0.11 valid=10s;

    # API proxy — resolved at runtime
    location /api/ {
        proxy_pass http://taxsight-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Cache static assets aggressively (content-hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html (it references hashed assets)
    location /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # SPA routing — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
